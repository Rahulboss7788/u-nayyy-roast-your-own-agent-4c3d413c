name: Strip trailing newlines

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip trailing newline from JSON files
        run: |
          for f in package.json .makefun/owner.json; do
            if [ "$(tail -c 1 "$f" | od -An -tx1 | tr -d ' \n')" = "0a" ]; then
              truncate -s -1 "$f"
              echo "Stripped trailing newline from $f"
            else
              echo "No trailing newline in $f"
            fi
          done
      - name: Commit if changed
        run: |
          git config user.name "Rahulboss7788"
          git config user.email "Rahulboss7788@users.noreply.github.com"
          git add package.json .makefun/owner.json
          git diff --cached --quiet || git commit -m "Strip trailing newlines from package.json and owner.json"
          git push
